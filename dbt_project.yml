name: ecommerce
version: "1.0.0"
profile: ecommerce

vars:
  # dias sin comprar a partir de los cuales un cliente deja de considerarse activo
  active_window_days: 90
  # margen en dias que se reprocesa hacia atras en las cargas incrementales
  lookback_days: 3

models:
  ecommerce:
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: incremental
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
